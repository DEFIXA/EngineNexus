name: Blender Advancements V2 validation

on:
  push:
    branches:
      - feature/blender-advancements-v2
    paths:
      - 'tools/blender-advancements-v2/**'
      - '.github/workflows/blender-advancements-v2.yml'
  pull_request:
    paths:
      - 'tools/blender-advancements-v2/**'
      - '.github/workflows/blender-advancements-v2.yml'
  workflow_dispatch:

concurrency:
  group: blender-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m compileall -q tools/blender-advancements-v2
      - name: Unit tests and planning smoke tests
        working-directory: tools/blender-advancements-v2
        run: |
          python -m unittest discover -s tests -v
          python -m asset_factory.cli plan examples/twisted_tree.json
          python -m asset_factory.cli plan examples/dragon_leg.json
      - name: Package skill overlay ZIP
        run: |
          cd tools
          zip -r -q ../blender_advancements_v2_overlay.zip blender-advancements-v2 -x '*/__pycache__/*' '*.pyc'
      - uses: actions/upload-artifact@v4
        with:
          name: blender-advancements-v2-overlay
          path: blender_advancements_v2_overlay.zip

  blender-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          /usr/bin/blender --background --python-exit-code 1 --python-expr "import numpy; print('NumPy:', numpy.__version__)"
      - name: Procedural twisted tree
        working-directory: tools/blender-advancements-v2
        run: python -m asset_factory.cli build examples/twisted_tree.json --blender /usr/bin/blender
      - name: Procedural dragon leg
        id: dragon_leg
        continue-on-error: true
        working-directory: tools/blender-advancements-v2
        run: python -m asset_factory.cli build examples/dragon_leg.json --blender /usr/bin/blender
      - name: Full dragon clay geometry
        id: full_dragon
        continue-on-error: true
        working-directory: tools/blender-advancements-v2
        run: python -m asset_factory.cli build examples/full_dragon.json --blender /usr/bin/blender
      - name: Procedural building
        working-directory: tools/blender-advancements-v2
        run: python -m asset_factory.cli build examples/modular_building.json --blender /usr/bin/blender
      - name: Procedural rock
        working-directory: tools/blender-advancements-v2
        run: python -m asset_factory.cli build examples/rock.json --blender /usr/bin/blender
      - name: Procedural terrain
        working-directory: tools/blender-advancements-v2
        run: python -m asset_factory.cli build examples/terrain.json --blender /usr/bin/blender
      - name: Require both creature builds to pass
        if: always()
        run: |
          test "${{ steps.dragon_leg.outcome }}" = "success"
          test "${{ steps.full_dragon.outcome }}" = "success"
      - name: Verify exported files
        working-directory: tools/blender-advancements-v2
        run: |
          test -s work/twisted_dead_tree_001/asset.glb
          test -s work/twisted_dead_tree_001/collision.glb
          test -s work/twisted_dead_tree_001/qc.json
          test -s work/twisted_dead_tree_001/qc_front.svg
          test -s work/twisted_dead_tree_001/qc_side.svg
          test -s work/dragon_hindleg_001/asset.glb
          test -s work/dragon_hindleg_001/qc.json
          test -s work/dragon_hindleg_001/clay_front.png
          test -s work/dragon_hindleg_001/clay_side.png
          test -s work/dragon_hindleg_001/clay_three_quarter.png
          test -s work/full_dragon_clay_001/asset.glb
          test -s work/full_dragon_clay_001/clay_front.png
          test -s work/full_dragon_clay_001/clay_side.png
          test -s work/full_dragon_clay_001/clay_three_quarter.png
          test -s work/full_dragon_clay_001/clay_head.png
          test -s work/full_dragon_clay_001/clay_wings.png
          test -s work/modular_building_001/asset.glb
          test -s work/rock_001/asset.glb
          test -s work/terrain_001/asset.glb
          for asset in twisted_dead_tree_001 modular_building_001 rock_001 terrain_001; do
            for view in front side three_quarter; do
              test -s "work/$asset/clay_$view.png"
            done
          done
      - name: Emit full-dragon preview for visual review
        if: always()
        working-directory: tools/blender-advancements-v2
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          for label, p in [("DRAGON", Path("work/full_dragon_clay_001/clay_three_quarter.png")), ("LEG", Path("work/dragon_hindleg_001/clay_three_quarter.png")), ("HEAD", Path("work/full_dragon_clay_001/clay_head.png")), ("WINGS", Path("work/full_dragon_clay_001/clay_wings.png")), ("TREE", Path("work/twisted_dead_tree_001/clay_three_quarter.png")), ("BUILDING", Path("work/modular_building_001/clay_three_quarter.png")), ("ROCK", Path("work/rock_001/clay_three_quarter.png")), ("TERRAIN", Path("work/terrain_001/clay_three_quarter.png"))]:
              if p.is_file():
                  print("BEGIN_" + label + "_PREVIEW_BASE64")
                  print(base64.b64encode(p.read_bytes()).decode("ascii"))
                  print("END_" + label + "_PREVIEW_BASE64")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blender-smoke-outputs
          path: tools/blender-advancements-v2/work/
